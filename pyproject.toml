[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mycolorpy"
version = "1.5.2"
authors = [
  { name="Binod Bhattarai", email="info@binodb.com.np" },
]
description = "Create an array of colors from a given colormap"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["Color", "Hexcolor", "Colormap"]
dependencies = [
    "numpy>=2.1.0",
    "matplotlib>=3.10.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/binodbhttr/mycolorpy"

[tool.setuptools]
packages = ["mycolorpy"]